apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: aticurando

spec:
  replicas: 3

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api
          image: ghcr.io/matos795/aticurando-api:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3002

          readinessProbe:
            httpGet:
              path: /aticurando/v1/health
              port: 3002

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 3002

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: api-config

            - secretRef:
                name: api-secret